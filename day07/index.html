<style>

<div id="root">
  <canvas id="bgc" class="a" width="1080" height="1920" style="left:0;top:0"></canvas>
  <div id="stage" class="a" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="cap"></div>
  <div id="logo"><img src="logo.png"></div>

</div>
<script>
const VO=3.0;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eb=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const el=x=>{x=clamp(x);return x===0||x===1?x:Math.pow(2,-9*x)*Math.sin((x*10-.75)*(2*Math.PI/3))+1};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,x)=>a+(b-a)*x;
const hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177;h=h^(h>>>16);return ((h>>>0)%10000)/10000};
function D(parent,css,html,cls){const e=document.createElement('div');if(cls)e.className=cls;e.style.cssText='position:absolute;'+css;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
const INK='#2A1D17',MINT='#4CC9F0',CORAL='#E5383B',GOLD='#FFC24A',AMB='#D98200',PAPER='#FBF3E8';

/* ---------- script / captions ---------- */
const R=2.8;
const CHUNKS=[
 ["IELTS, PTE or *TOEFL?*",0],
 ["There's *no single winner.*",.2],
 ["The right test is the one your|*university* and *visa route* accept.",0],
 ["So check both on|*official websites* first.",.3],
 ["Many students pick whatever|their *friends* took.",0],
 ["Others book the exam before|*checking* the requirement,",0],
 ["and then have to *retake* it.",.2],
 ["That wastes *time and money.*",.3],
 ["So follow *three steps.*",.3],
 ["*First:* check what is *accepted.*|Course page and immigration website.",.2],
 ["*Second:* match the test|to your *style.*",.2],
 ["*IELTS:* a speaking test|with a real person.",0],
 ["*PTE:* fully on a computer.",0],
 ["*TOEFL:* computer-based, too.",.3],
 ["*Third:* practise that exact format|with *timed mock tests* before you book.",.3],
 ["Rules and score needs change,|so check *official sources.*",.3],
 ["Don't pick the *popular* test.",.2],
 ["Pick the *right* test.",.3],
 ["Not sure which one fits you?|*DM START* or visit vvisa.in",0]];
const KS=[0.06,2.88,4.86,8.86,11.90,14.66,17.62,20.68,22.86,24.28,30.76,33.96,36.70,39.58,42.06,47.16,52.02,53.76,55.06],KE=[2.36,4.20,8.38,11.16,14.08,17.16,19.78,22.24,23.98,30.04,33.14,36.34,38.92,41.40,46.68,51.36,53.42,54.64,59.90],SP=1.08;
const CS=KS.map(x=>VO+x/SP),CE=KE.map(x=>VO+x/SP);
const DUR=Math.min(59.8,Math.ceil((CE[CE.length-1]+1.0)*10)/10);
window.DUR=DUR;window.CS=CS;
const S=CS;
const PLAN=[
 [0,CS[0],'L','#FBF3E8'],
 [CS[0],CS[2],'D','#211B1A'],
 [CS[2],CS[4],'L','#FBF3E8'],
 [CS[4],CS[8],'D','#2B2321'],
 [CS[8],CS[9],'L','#F6E9D8'],
 [CS[9],CS[10],'D','#211B1A'],
 [CS[10],CS[14],'L','#FBF3E8'],
 [CS[14],CS[15],'D','#2B2321'],
 [CS[15],CS[16],'L','#F6E9D8'],
 [CS[16],CS[18],'D','#211B1A'],
 [CS[18],DUR,'B','#0E6BA8']];
const WCOL={L:'#FBF3E8',D:'#211B1A',B:'#0E6BA8'};
function worldAt(t){let k=0;PLAN.forEach((p,i)=>{if(t>=p[0])k=i});return k}

/* ---------- pixel background ---------- */
const bgc=document.getElementById('bgc'),ctx=bgc.getContext('2d');const CELL=40,NX=27,NY=48;
function shade(hex,k){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);const f=v=>Math.max(0,Math.min(255,Math.round(v+k)));return `rgb(${f(r)},${f(g)},${f(b)})`}
function drawBg(t){const k=worldAt(t);const cur=PLAN[k],prev=PLAN[Math.max(0,k-1)];const ts=cur[0];
 for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
  const d=hash(x,y,k)*.32+(y/NY)*.12;const on=k===0||t>=ts+d;
  const base=on?cur[3]:prev[3];const dark=(on?cur[2]:prev[2])!=='L';
  const n=(hash(x,y,99)-.5)*(dark?7:5);
  let col=shade(base,n);
  if(on&&t<ts+d+.1&&k>0)col=dark?'#4CC9F0':'#A9E4F7';
  if(on&&t<ts+d+.1&&k>0&&cur[2]==='B')col='#8ED6FF';
  ctx.fillStyle=col;ctx.fillRect(x*CELL,y*CELL,CELL,CELL)}
 // soft vignette glow on dark
 }

/* ---------- avatars ---------- */
const AVF=['s04','s05','s09','s10','s12','s13','s16','s20','s23','headache','think','thumbs'];
const AVI={};const avBox=document.getElementById('av');
AVF.forEach(f=>{const i=document.createElement('img');i.src='av/'+f+'.png';avBox.appendChild(i);AVI[f]=i});
const AVT=[[0,null],[CS[0]+.1,'think'],[CS[1],'s09'],[CS[2],'s12'],[CS[4],'s16'],[CS[6],'headache'],[CS[8],'s04'],[CS[9],'s20'],[CS[10],'s10'],[CS[14],'s05'],[CS[15],'s12'],[CS[16],'s13'],[CS[17],'thumbs'],[CS[18],'s23']];
function updAv(t){let k=0;AVT.forEach((a,i)=>{if(t>=a[0])k=i});const [t0,f]=AVT[k];
 for(const n in AVI)AVI[n].style.display=(n===f)?'block':'none';if(!f)return;
 const im=AVI[f],p=eb(pr(t,t0,.5)),bob=Math.sin(t*3.1)*6;
 im.style.opacity=clamp(pr(t,t0,.15));
 im.style.transform=`translateY(${(1-p)*280+(p>.99?bob:0)}px) scale(${.8+.2*p}) rotate(${(1-p)*6}deg)`}

/* ---------- captions with hero-word flash ---------- */
const CH=[];
(function(){const cap=document.getElementById('cap');
 CHUNKS.forEach(([s],ci)=>{const S=CS[ci],En=CE[ci];const lines=s.split('|');let on=false;
  const toks=lines.map(l=>l.split(' ').map(tk=>{if(tk.startsWith('*')){on=true;tk=tk.slice(1)}let k=on;if(tk.endsWith('*')){tk=tk.slice(0,-1);on=false}return {w:tk,k}}));
  const flat=toks.flat();const tot=flat.reduce((a,x)=>a+x.w.length+2,0);let cum=0;
  const div=document.createElement('div');div.className='chunk';cap.appendChild(div);
  toks.forEach((ws,li)=>{ws.forEach(o=>{o.t=S+(cum/tot)*(En-S);cum+=o.w.length+2;o.el=document.createElement('span');o.el.className='w';o.el.textContent=o.w;div.appendChild(o.el)});
   if(li<toks.length-1){const br=document.createElement('div');br.style.cssText='flex-basis:100%;height:0';div.appendChild(br)}});
  const nchars=s.replace(/\||\*/g,'').length;const fs=nchars>60?58:nchars>44?66:nchars>32?74:86;
  const hk=flat.find(x=>x.k);let hero=null;
  if(hk){hero=document.createElement('div');hero.className='hero';hero.textContent=hk.w.replace(/[.,]/g,'');cap.appendChild(hero);hk.hero=true}
  CH.push({t0:S,t1:null,ws:flat,div,fs,hero,hk});});
 CH.forEach((c,i)=>{c.t1=i<CH.length-1?CH[i+1].t0:DUR})
})();
function updCap(t){const k=worldAt(t);const world=PLAN[k][2];const light=world==='L';
 const tc=light?INK:'#fff',kc=light?AMB:GOLD,sh=light?'0 4px 14px rgba(255,255,255,.7)':'0 6px 24px rgba(2,16,20,.6)';
 let act=null;CH.forEach(c=>{if(t>=c.t0-.04&&t<c.t1)act=c});
 CH.forEach(c=>{c.div.style.display=(c===act)?'flex':'none';if(c!==act&&c.hero)c.hero.style.opacity=0});
 if(t<CS[0]-.04){}
 if(!act)return;
 const fl=act.hk?.4:0;
 act.ws.forEach(o=>{const p=eb(pr(t,o.t-.02,.3));let op=clamp(pr(t,o.t-.02,.12));
  if(o.hero&&fl)op*=clamp(pr(t,act.t0+.28,.2));
  o.el.style.opacity=op;o.el.style.fontSize=act.fs+'px';o.el.style.color=o.k?kc:tc;o.el.style.textShadow=sh;
  o.el.style.transform=`translateY(${(1-p)*30}px) scale(${.85+.15*p})`});
 if(act.hero){const h=act.hero;const a=t-act.t0;const sz=Math.min(210,1700/Math.max(4,act.hk.w.length));
  const grow=eb(pr(a,0,.22)),shr=eio(pr(a,.3,.22));
  h.style.fontSize=sz+'px';h.style.color=kc;h.style.textShadow=light?'0 8px 30px rgba(217,130,0,.35)':'0 0 40px rgba(255,194,74,.45)';
  h.style.opacity=clamp(pr(a,0,.08))*(1-shr);
  h.style.transform=`scale(${(.6+.4*grow)*(1-.25*shr)}) translateY(${shr*-20}px)`;
  h.style.filter=`blur(${(1-grow)*6}px)`}}

/* ---------- scene registry ---------- */
const stage=document.getElementById('stage');const SC=[];
function scene(i,build,upd){const root=D(stage,'left:0;top:0;width:1080px;height:1920px;opacity:0');const c=build(root);SC.push({i,root,c,upd})}
const pill=(p,txt,css,bg,col)=>D(p,css,txt,'chip').style&&0;
function mkChip(p,txt,css,bg,col,fs){const e=D(p,css+`;background:${bg};color:${col};${fs?'font-size:'+fs+'px':''}`,txt,'chip');return e}
function pop(e,t,a,d=.45,from=.6){const p=eb(pr(t,a,d));e.style.opacity=clamp(pr(t,a,.15));e.style.transform=`scale(${from+(1-from)*p})`}
function rise(e,t,a,dy=40,d=.5){const p=eb(pr(t,a,d));e.style.opacity=clamp(pr(t,a,.18));e.style.transform=`translateY(${(1-p)*dy}px)`}
function tick(el,on,light){el.style.background=on?MINT:(light?'#E3D6C7':'rgba(255,255,255,.14)');el.style.color=on?INK:'transparent';}
function cursor(p){return D(p,'left:0;top:0;width:44px;height:44px;opacity:0;z-index:50;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))','<svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.8 22 L14.6 20.8 L11.5 13.8 L18 13.8Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>')}
function moveCursor(cu,t,pts){ // pts: [[t,x,y,click?]]
 let k=0;pts.forEach((p,i)=>{if(t>=p[0])k=i});const a=pts[k],b=pts[Math.min(k+1,pts.length-1)];
 const x=a===b?a[1]:lerp(a[1],b[1],eio(pr(t,a[0]+.15,b[0]-a[0]-.15)));const y=a===b?a[2]:lerp(a[2],b[2],eio(pr(t,a[0]+.15,b[0]-a[0]-.15)));
 cu.style.opacity=clamp(pr(t,pts[0][0],.2));cu.style.left=x+'px';cu.style.top=y+'px'}
function ripple(p,x,y){const r=D(p,`left:${x-30}px;top:${y-30}px;width:60px;height:60px;border-radius:50%;border:4px solid ${MINT};opacity:0`);return r}
function updRipple(r,t,a){const q=pr(t,a,.45);r.style.opacity=q>0&&q<1?1-q:0;r.style.transform=`scale(${.3+q*1.6})`}
const FOOT='Illustrative example';

/* ===== 0 Opener ===== */
scene(0,root=>{const d={};
 d.ring=D(root,'left:230px;top:610px;width:620px;height:620px;border-radius:50%;border:8px dashed rgba(76,201,240,.45);opacity:0');
 d.day=D(root,`left:0;top:520px;width:1080px;text-align:center;font-weight:800;font-size:150px;letter-spacing:18px;color:${INK}`,'DAY');
 d.num=D(root,'left:0;top:660px;width:1080px;height:420px;overflow:hidden;text-align:center');
 d.col=D(root,'left:0;top:0;width:1080px','',''); d.num.appendChild(d.col);
 for(let i=1;i<=7;i++)D(d.col,`left:0;top:${(i-1)*420}px;width:1080px;height:420px;line-height:420px;text-align:center;font-weight:800;font-size:420px;background:linear-gradient(180deg,#A9E4F7,#1B8FBF 55%,#0E6BA8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent`,'0'+i);
 d.sub=D(root,`left:0;top:1130px;width:1080px;text-align:center;font-weight:700;font-size:58px;color:${INK};letter-spacing:2px`,'of knowing study visa');
 d.line=D(root,'left:340px;top:1100px;width:400px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3EE6B0,#FFC24A);transform-origin:0 50%');
 return d},(c,t)=>{
 c.ring.style.opacity=clamp(pr(t,0,.4));c.ring.style.transform=`scale(${1+.08*Math.sin(t*4)}) rotate(${t*40}deg)`;
 const p=eb(pr(t,.1,.5));c.day.style.opacity=clamp(pr(t,.1,.2));c.day.style.transform=`translateY(${(1-p)*-80}px) scale(${.7+.3*p})`;
 const r=eio(pr(t,.45,1.3));c.col.style.top=(-r*6*420)+'px';
 const pn=eb(pr(t,.35,.5));c.num.style.opacity=clamp(pr(t,.3,.15));c.num.style.transform=`scale(${.5+.5*pn})`;
 c.line.style.transform=`scaleX(${eo(pr(t,1.7,.5))})`;
 const ps=eb(pr(t,1.8,.45));c.sub.style.opacity=clamp(pr(t,1.75,.2));c.sub.style.transform=`translateY(${(1-ps)*40}px)`});


const grp=(e,t,a,b)=>{e.style.opacity=clamp(pr(t,a,.25))*(1-clamp(pr(t,b-.25,.25)));e.style.transform=`translateY(${(1-eb(pr(t,a,.5)))*60}px)`};
function stepBar(root,n){const d=[];const row=D(root,'left:0;top:576px;width:1080px;height:80px');for(let i=0;i<3;i++){const p=D(row,`left:${540+(i-1)*250-105}px;top:0;width:210px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;letter-spacing:3px`,'STEP '+(i+1));d.push(p)}return d}
function updStepBar(pp,n,light,t,a){pp.forEach((p,i)=>{const cur=i===n,done=i<n;p.style.background=cur?`linear-gradient(135deg,${GOLD},#FF9F43)`:(done?MINT:(light?'#E3D6C7':'rgba(255,255,255,.14)'));p.style.color=cur||done?INK:(light?'#8C7B6E':'rgba(255,255,255,.6)');p.style.boxShadow=cur?'0 0 32px rgba(255,194,74,.7)':'none';p.style.transform=`scale(${cur?1:.92})`;p.style.opacity=clamp(pr(t,a,.3))})}
function person(p,css){const w=D(p,css);D(w,'left:35px;top:0;width:70px;height:70px;border-radius:50%;background:'+INK);D(w,'left:0;top:80px;width:140px;height:80px;border-radius:70px 70px 12px 12px;background:'+INK);return w}

scene(1,root=>{const d={};const nm=['IELTS','PTE','TOEFL'];
 d.cards=nm.map((n,i)=>{const c=D(root,`left:${50+i*335}px;top:720px;width:310px;height:440px`,'','card ltc');

  D(c,'left:0;top:0;width:310px;height:22px;border-radius:30px 30px 0 0;background:linear-gradient(90deg,'+MINT+','+GOLD+')');return c});
 d.q=D(root,'left:415px;top:1120px;width:250px;height:250px;border-radius:50%;background:'+CORAL+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:800;box-shadow:0 20px 50px rgba(229,56,59,.45);opacity:0;z-index:4','?');

scene(2,root=>{const d={};
 d.card=D(root,'left:90px;top:620px;width:900px;height:560px','','card ltc');
 D(d.card,'left:44px;top:30px','IS THE TEST ACCEPTED BY...','lab');
 d.rows=[];['Your university','Your visa route'].forEach((nm,i)=>{const r=D(d.card,`left:44px;top:${100+i*200}px;width:812px;height:170px;border-radius:26px;background:#F6EEE3`);
  const tk=D(r,'left:30px;top:43px;width:84px;height:84px;border-radius:50%;background:#E3D6C7;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:transparent','✓');
